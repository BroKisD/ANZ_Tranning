name: CI/CD to Cloud Run

on:
  push:
    branches: "main"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write 

jobs:
  build-and-deploy:
    name: Test, Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate and Setup Google Cloud SDK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/setup-gcloud@v2

      - name: Check if service.yml exists and handle teardown if missing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ ! -f service.yml ]; then
            
            gcloud run services delete anz-training-service \
              --region asia-southeast1 \
              --quiet 
              
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run static checks
        run: go vet ./...

      - name: Run unit tests
        run: go test -v ./...

      - name: Run integration tests
        run: go test -v -tags=integration ./...

      - name: Build Docker image
        run: docker build -t anz-training:${{ github.sha }} .

      - name: Authorize Docker to Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev

      - name: Tag and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_BASE: asia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/anz-repo/anz-training
        run: |
          docker tag anz-training:${{ github.sha }} $IMAGE_BASE:${{ github.sha }}
          docker push $IMAGE_BASE:${{ github.sha }}
       
      - name: Prepare and Validate service.yml
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_BASE: asia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/anz-repo/anz-training
        run: |
          sed -i "s|image:.*|image: $IMAGE_BASE:${{ github.sha }}|g" service.yml
          gcloud run services replace service.yml --region asia-southeast1 --dry-run

      - name: Deploy to Cloud Run
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          gcloud run services replace service.yml --region asia-southeast1