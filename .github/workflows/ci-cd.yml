name: CI/CD to Cloud Run

on:
  push:
    branches: "main"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write 

jobs:
  build-and-deploy:
    name: Test, Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test -v ./...

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker to Artifact Registry
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev

      - name: Build and Push Docker Image
        env:
          IMAGE_BASE: asia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/anz-repo/anz-training
        run: |
          docker build -t $IMAGE_BASE:${{ github.sha }} -t $IMAGE_BASE:latest .
          docker push $IMAGE_BASE:${{ github.sha }}
          docker push $IMAGE_BASE:latest

      - name: Deploy to Cloud Run
        env:
          IMAGE_BASE: asia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/anz-repo/anz-training
        run: |
          gcloud run deploy anz-training-service \
            --image $IMAGE_BASE:latest \
            --platform managed \
            --region asia-southeast1 \
            --allow-unauthenticated \
            --cpu=1 \
            --memory=512Mi \
            --min-instances=0 \
            --max-instances=1 \
            --add-cloudsql-instances=${{ secrets.GCP_PROJECT_ID }}:asia-southeast1:anz-trainning