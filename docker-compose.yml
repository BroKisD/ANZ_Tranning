services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "6868:3306" 
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/temporal:1.10.1
    # the image runs as a non-root user and a fresh named volume is root-owned,
    # so the dev server could not create /data/temporal.db; training setup only
    user: "0:0"
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal_data:/data
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    command: ["serve"]
    ports:
      - "9090:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      API_KEY: ${API_KEY}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      REPO_ONLY: ${REPO_ONLY:-false}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEMO_TEMPLATE_REPO: ${DEMO_TEMPLATE_REPO:-}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_REGION: ${GCP_REGION:-}
      GCP_ARTIFACT_REPO: ${GCP_ARTIFACT_REPO:-}
      GCP_WIF_PROVIDER: ${GCP_WIF_PROVIDER:-}
      GCP_SERVICE_ACCOUNT: ${GCP_SERVICE_ACCOUNT:-}
      GCP_ALLOWED_GITHUB_OWNERS: ${GCP_ALLOWED_GITHUB_OWNERS:-}
      DEPLOY_TIMEOUT: ${DEPLOY_TIMEOUT:-}
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      db:
        condition: service_healthy
      temporal:
        condition: service_healthy

volumes:
  mysql_data:
  temporal_data: